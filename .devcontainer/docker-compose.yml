version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: devcontainer-postgres
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: devdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../init:/docker-entrypoint-initdb.d:ro

  pgadmin:
    image: dpage/pgadmin4
    container_name: devcontainer-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin_servers.json:/pgadmin4/servers.json
    entrypoint:
    - /bin/sh
    - -c
    - |
      mkdir -p /var/lib/pgadmin/storage/admin_admin.com/
      cp /pgadmin4/servers.json /var/lib/pgadmin/storage/admin_admin.com/servers.json
      /entrypoint.sh

volumes:
  pgdata:
  pgadmin_data:
